name: Actualizar Tasa BCV Diariamente

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  actualizar-bcv:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar Edge Function
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.SUPABASE_URL }}/functions/v1/actualizar-bcv" \
            -d '{}'
